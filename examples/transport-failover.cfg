# Transport failover: keep reaching the same nodes over QUIC when their TCP
# transport is blocked on the path, and go back to TCP once it works again.
#
# The primary transport is described by the server line of backend "nodes".
# The fallback transport is an ordinary server in another backend, which is
# what allows it to have its own protocol, transport layer, mux, TLS context
# and health check. New connections are directed to it while the primary
# transport is down; established connections are never migrated.
#
# Start it with:
#   haproxy -f examples/transport-failover.cfg
#
# Watch the transport state with:
#   echo "show servers transport" | socat /tmp/haproxy-tf.sock -

global
    strict-limits
    # QUIC on the backend side is still tagged experimental upstream
    expose-experimental-directives
    stats socket /tmp/haproxy-tf.sock mode 600 level admin
    stats timeout 1h
    log stdout format raw local0 info

defaults
    log global
    mode http
    option httplog
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    retries 2

frontend fe_main
    bind :8080
    default_backend nodes

# Prometheus metrics, including the transport failover ones:
#   haproxy_server_fallback_transport_active
#   haproxy_server_transport_switches_total
#   haproxy_server_fallback_transport_connections_total
#   haproxy_server_primary_transport_failures_total
#   haproxy_server_transport_recovery_attempts_total
frontend fe_metrics
    bind :8405
    http-request use-service prometheus-exporter if { path /metrics }

# The fallback transport: the very same nodes, reached over QUIC.
# This backend is not meant to be routed to directly. Its own "timeout connect"
# and health check settings apply to the connections which use this transport.
backend nodes_quic
    mode http
    timeout connect 3s
    server n1 quic4@10.0.0.2:443 ssl verify none alpn h3 check inter 5s fall 3 rise 2
    server n2 quic4@10.0.0.3:443 ssl verify none alpn h3 check inter 5s fall 3 rise 2

# The primary transport: plain TCP. Each server references its QUIC counterpart.
#
#   transport-fall 3    3 confirmed connection failures move the traffic away
#   transport-rise 5    5 successful TCP probes are needed to come back
#   transport-probe 5s  the health check probes TCP every 5s while on QUIC
#   transport-hold 30s  and the traffic stays on QUIC for at least 30s
backend nodes
    mode http
    balance roundrobin
    timeout connect 2s
    server n1 10.0.0.2:443 check inter 2s fall 3 rise 2 fallback-transport nodes_quic/n1 transport-fall 3 transport-rise 5 transport-probe 5s transport-hold 30s
    server n2 10.0.0.3:443 check inter 2s fall 3 rise 2 fallback-transport nodes_quic/n2 transport-fall 3 transport-rise 5 transport-probe 5s transport-hold 30s
